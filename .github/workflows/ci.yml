name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/stockpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (PostgreSQL)
        run: pytest tests/integration -q
      - name: Migrations render offline
        run: alembic -c backend/alembic.ini upgrade head --sql > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health | grep '"database":true'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          docker compose logs --tail=50 api worker
      - if: always()
        run: docker compose down -v
